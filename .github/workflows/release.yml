name: Release

on:
  push:
    tags: ['v[0-9]*']

# Required secrets:
#   CLOUDFLARE_API_TOKEN  — wrangler deploy + pages deploy + r2 object put
#   CLOUDFLARE_ACCOUNT_ID — r2 object put

jobs:
  source-install:
    uses: ./.github/workflows/source-install.yml

  # ── Build the macOS DMG on a real Mac runner ──────────────────────────────
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      dmg: ${{ steps.ver.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dmg=Hauddy-${VERSION}-arm64.dmg" >> $GITHUB_OUTPUT

      - name: Sync version across all packages
        run: |
          node scripts/set-version.mjs ${{ steps.ver.outputs.version }}
          # Bake SIDECAR_VERSION into src/version.ts; tsc -b doesn't run npm
          # prebuild lifecycle scripts so we must call gen-version.mjs explicitly.
          node packages/sidecar/scripts/gen-version.mjs

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (unsigned)
        # Use working-directory so npm reads package.json directly instead of
        # resolving the workspace via package-lock.json (which still has 0.1.0).
        working-directory: packages/desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: packages/desktop/release/*.dmg
          retention-days: 1

  # ── Build the Linux .deb and .AppImage on an Ubuntu runner ────────────────
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync version across all packages
        run: |
          node scripts/set-version.mjs ${{ steps.ver.outputs.version }}
          node packages/sidecar/scripts/gen-version.mjs

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (Linux)
        working-directory: packages/desktop
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packages/desktop/release/*.deb
            packages/desktop/release/*.AppImage
          retention-days: 1

  # ── Build the Windows NSIS installer on a Windows runner ──────────────────
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync version across all packages
        shell: bash
        run: |
          node scripts/set-version.mjs ${{ steps.ver.outputs.version }}
          node packages/sidecar/scripts/gen-version.mjs

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (Windows)
        working-directory: packages/desktop
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: packages/desktop/release/*.exe
          retention-days: 1

  # ── Upload to R2, deploy Cloudflare, create GitHub Release ───────────────
  deploy:
    name: Deploy & Release
    needs: [source-install, build-mac, build-linux, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating a GitHub Release
    env:
      VERSION: ${{ needs.build-mac.outputs.version }}
      DMG: ${{ needs.build-mac.outputs.dmg }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Sync version across all packages
        run: node scripts/set-version.mjs ${{ env.VERSION }}

      - name: Build TypeScript packages
        run: npm run build

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      # Upload all platform builds to R2.
      # Each gets a stable "latest" pointer (served by /download/<platform>) and an
      # immutable versioned archive. Linux/Windows names are found by glob since
      # electron-builder's exact output name varies slightly across versions.
      - name: Upload release artifacts to R2
        working-directory: packages/platform
        run: |
          # macOS
          npx wrangler r2 object put hauddy-releases/downloads/mac-arm64-latest.dmg \
            --file "$GITHUB_WORKSPACE/dist-artifacts/$DMG" \
            --content-type application/octet-stream --remote
          npx wrangler r2 object put "hauddy-releases/downloads/Hauddy-${VERSION}-arm64.dmg" \
            --file "$GITHUB_WORKSPACE/dist-artifacts/$DMG" \
            --content-type application/octet-stream --remote

          # Linux .deb
          DEB=$(find "$GITHUB_WORKSPACE/dist-artifacts" -name "*.deb" | head -1)
          npx wrangler r2 object put hauddy-releases/downloads/linux-amd64-latest.deb \
            --file "$DEB" --content-type application/octet-stream --remote
          npx wrangler r2 object put "hauddy-releases/downloads/$(basename "$DEB")" \
            --file "$DEB" --content-type application/octet-stream --remote

          # Linux AppImage
          APPIMAGE=$(find "$GITHUB_WORKSPACE/dist-artifacts" -name "*.AppImage" | head -1)
          npx wrangler r2 object put hauddy-releases/downloads/linux-x86_64-latest.AppImage \
            --file "$APPIMAGE" --content-type application/octet-stream --remote
          npx wrangler r2 object put "hauddy-releases/downloads/$(basename "$APPIMAGE")" \
            --file "$APPIMAGE" --content-type application/octet-stream --remote

          # Windows
          EXE=$(find "$GITHUB_WORKSPACE/dist-artifacts" -name "*.exe" | head -1)
          npx wrangler r2 object put hauddy-releases/downloads/windows-x64-latest.exe \
            --file "$EXE" --content-type application/octet-stream --remote
          npx wrangler r2 object put "hauddy-releases/downloads/$(basename "$EXE")" \
            --file "$EXE" --content-type application/octet-stream --remote

      # Publish assets before /api/version and the dashboard advertise this version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hauddy v${{ env.VERSION }}
          body: |
            ## Download

            | Platform | File | Direct link |
            |---|---|---|
            | macOS (Apple Silicon) | `Hauddy-${{ env.VERSION }}-arm64.dmg` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/Hauddy-${{ env.VERSION }}-arm64.dmg |
            | Windows (x64) | `Hauddy.Setup.${{ env.VERSION }}.exe` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/Hauddy.Setup.${{ env.VERSION }}.exe |
            | Linux (Debian/Ubuntu) | `hauddy_${{ env.VERSION }}_amd64.deb` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/hauddy_${{ env.VERSION }}_amd64.deb |
            | Linux (Universal) | `hauddy_${{ env.VERSION }}_x86_64.AppImage` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/hauddy_${{ env.VERSION }}_x86_64.AppImage |

            macOS: unsigned — right-click → Open on first launch.

            ---
            See [CHANGELOG](https://github.com/hauddy/hauddy/blob/main/CHANGELOG.md) for what's new.
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.deb
            dist-artifacts/*.AppImage
            dist-artifacts/*.exe
          fail_on_unmatched_files: true

      # Deploy the platform Worker. Passes LATEST_CLIENT_VERSION so /api/version
      # and the auth_rejected frame can report the newest available download.
      - name: Deploy platform Worker
        working-directory: packages/platform
        run: npx wrangler deploy --var "LATEST_CLIENT_VERSION:${VERSION}"

      # Build and deploy the web dashboard (app.hauddy.com)
      - name: Build web dashboard
        run: npm run build -w @hauddy/web

      - name: Deploy web dashboard
        working-directory: packages/web
        run: |
          npx wrangler pages deploy dist --project-name hauddy-app --branch main

      # Build and deploy the landing site (hauddy.com)
      - name: Build landing site
        run: npm run build -w @hauddy/landing

      - name: Deploy landing site
        working-directory: packages/landing
        run: |
          npx wrangler pages project create hauddy-landing --production-branch main 2>/dev/null || true
          npx wrangler pages deploy dist --branch main
