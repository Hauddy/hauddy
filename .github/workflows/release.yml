name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch: # Build a candidate without deploying or creating a tag.

# Required secrets:
#   CLOUDFLARE_API_TOKEN  — wrangler deploy + pages deploy + r2 object put
#   CLOUDFLARE_ACCOUNT_ID — r2 object put

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release-version.mjs

  source-install:
    uses: ./.github/workflows/source-install.yml

  # ── Build the macOS DMG on a real Mac runner ──────────────────────────────
  build-mac:
    needs: version
    name: Build macOS DMG
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      dmg: ${{ steps.ver.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dmg=Hauddy-${VERSION}-arm64.dmg" >> $GITHUB_OUTPUT

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (unsigned)
        # Use working-directory so npm reads package.json directly instead of
        # resolving the workspace via package-lock.json (which still has 0.1.0).
        working-directory: packages/desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: packages/desktop/release/*.dmg
          retention-days: 30

  # ── Build the Linux .deb and .AppImage on an Ubuntu runner ────────────────
  build-linux:
    needs: version
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (Linux)
        working-directory: packages/desktop
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            packages/desktop/release/*.deb
            packages/desktop/release/*.AppImage
          retention-days: 30

  # ── Build the Windows NSIS installer on a Windows runner ──────────────────
  build-win:
    needs: version
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build TypeScript packages
        run: npm run build

      - name: Build desktop app (Windows)
        working-directory: packages/desktop
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: packages/desktop/release/*.exe
          retention-days: 30

  # ── Upload to R2, deploy Cloudflare, create GitHub Release ───────────────
  deploy:
    name: Deploy & Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, version, source-install, build-mac, build-linux, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating a GitHub Release
    env:
      VERSION: ${{ needs.build-mac.outputs.version }}
      DMG: ${{ needs.build-mac.outputs.dmg }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build TypeScript packages
        run: npm run build

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Build web dashboard
        run: npm run build -w @hauddy/web
      - name: Build landing site
        run: npm run build -w @hauddy/landing
      - name: Record release artifacts and checksums
        run: node scripts/release-artifacts.mjs dist-artifacts
      - name: Save verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist-artifacts/release-manifest.json
          retention-days: 90
      - name: Snapshot current download pointers
        run: node scripts/release-downloads.mjs snapshot dist-artifacts rollback-downloads
      - name: Archive versioned installers
        run: node scripts/release-downloads.mjs archive dist-artifacts rollback-downloads

      # Prepare a draft; publish only after production promotion succeeds.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Hauddy v${{ env.VERSION }}
          body: |
            ## Download

            | Platform | File | Direct link |
            |---|---|---|
            | macOS (Apple Silicon) | `Hauddy-${{ env.VERSION }}-arm64.dmg` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/Hauddy-${{ env.VERSION }}-arm64.dmg |
            | Windows (x64) | `Hauddy.Setup.${{ env.VERSION }}.exe` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/Hauddy.Setup.${{ env.VERSION }}.exe |
            | Linux (Debian/Ubuntu) | `hauddy_${{ env.VERSION }}_amd64.deb` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/hauddy_${{ env.VERSION }}_amd64.deb |
            | Linux (Universal) | `hauddy_${{ env.VERSION }}_x86_64.AppImage` | https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/hauddy_${{ env.VERSION }}_x86_64.AppImage |

            macOS: unsigned — right-click → Open on first launch.

            ---
            See [CHANGELOG](https://github.com/hauddy/hauddy/blob/main/CHANGELOG.md) for what's new.
          files: |
            dist-artifacts/*.dmg
            dist-artifacts/*.deb
            dist-artifacts/*.AppImage
            dist-artifacts/*.exe
            dist-artifacts/release-manifest.json
          fail_on_unmatched_files: true

      # Deploy code while preserving the previously advertised client version.
      - name: Deploy platform Worker
        working-directory: packages/platform
        run: |
          PREVIOUS_VERSION=$(node -p "require('../../rollback-downloads/snapshot.json').version")
          npx wrangler deploy --var "LATEST_CLIENT_VERSION:${PREVIOUS_VERSION}"

      - name: Deploy web dashboard
        working-directory: packages/web
        run: |
          npx wrangler pages deploy dist --project-name hauddy-app --branch main

      - name: Deploy landing site
        working-directory: packages/landing
        run: |
          npx wrangler pages deploy dist --branch main

      - name: Promote stable downloads
        run: node scripts/release-downloads.mjs promote dist-artifacts rollback-downloads
      - name: Advertise the new client version
        working-directory: packages/platform
        run: npx wrangler deploy --var "LATEST_CLIENT_VERSION:${VERSION}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Restore previous production state after failure
        if: failure()
        run: node scripts/release-downloads.mjs restore dist-artifacts rollback-downloads
      - name: Retain rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-downloads
          path: rollback-downloads
          retention-days: 30
