# Dedicated rehearsal resources; no production routes, storage or outbound email.
name = "hauddy-platform-staging"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "hauddy-staging-files"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "hauddy-staging-releases"

[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "hauddy-staging-waitlist"
database_id = "ee0f9559-f199-4e94-a17c-368b571cadbe"

[vars]
CORS_ORIGIN = "http://localhost:5173"
EMAIL_DELIVERY = "disabled"
MIN_CLIENT_VERSION = ""
LATEST_CLIENT_VERSION = ""
# Omit RATE_LIMIT: public staging retains normal limits. Only local fixtures may
# explicitly override it with --var RATE_LIMIT:off.
